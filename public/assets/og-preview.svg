<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Radial & Linear Gradients -->
    <radialGradient id="emeraldGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="630" fill="#0B0F17" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />

  <!-- Outer Card Border -->
  <rect x="20" y="20" width="1160" height="590" rx="32" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Logo Squircle -->
  <g transform="translate(100, 140)" filter="url(#shadow)">
    <rect width="160" height="160" rx="36" fill="url(#logoBg)" />
    <!-- Logo Symbol -->
    <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 42,68 A 38,38 0 1,1 118,68 C 118,96 80,132 80,132 C 80,132 42,96 42,68 Z" stroke-width="10" />
      <polyline points="55,65 68,65 74,50 84,84 90,65 105,65" stroke-width="9" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(300, 200)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
      VitalTrack AI
    </text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#94A3B8">
      Smart Health, AI Plate Nutrition &amp; Activity Tracking
    </text>
  </g>

  <!-- Feature Highlights Row -->
  <g transform="translate(100, 370)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="60" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
        📸 AI Food Lens
      </text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(250, 0)">
      <rect width="250" height="60" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
        🏃 Step Pedometer
      </text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(520, 0)">
      <rect width="260" height="60" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
        🥗 Macro Breakdown
      </text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(800, 0)">
      <rect width="200" height="60" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
        🔒 Private Vault
      </text>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(100, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748B">
      Powered by Google Cloud Firestore &amp; Clinical Nutrition Standards (ICMR-NIN &amp; USDA)
    </text>
    <text x="1000" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#10B981">
      ai-health-fitness-tracker.vercel.app
    </text>
  </g>
</svg>
